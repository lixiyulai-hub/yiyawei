# Yiyawei（咿呀喂） - 默认配置
# 用户通常只需修改 llm / hotkeys / recorder.device 即可接入自己的本地环境

app:
  name: Yiyawei
  version: 0.1.0-mvp
  default_mode: cursor_prompt
  log_level: INFO

hotkeys:
  # 按住开始录音，松开结束
  professional: alt+space          # 默认专业整理模式
  fast: alt+shift+space            # 极速整理模式（使用 fast_llm）
  cursor: alt+c                    # AI 任务需求模式
  terminal: alt+t                  # 终端命令模式
  gui_toggle: ctrl+.               # GUI 模式切换开始/停止录音；比 ctrl+0 更少撞浏览器快捷键

recorder:
  sample_rate: 16000
  channels: 1
  dtype: float32
  # 多麦克风环境可填 sounddevice 输入设备 index；留空使用系统默认输入设备
  device:
  # 最长单次录音秒数，防止误触
  max_duration_sec: 120
  auto_stop:
    enabled: true
    min_duration_sec: 1.2
    silence_sec: 2.0
    level_threshold: 0.015
    poll_interval_sec: 0.12

asr:
  # 产品主链路只保留 FunASR Paraformer。CPU 只是同一模型的备用设备，不是第二套 ASR。
  engine: funasr
  model: paraformer-zh
  language: zh
  device: cuda
  fallback_device: cpu
  vad_model: fsmn-vad
  punc_model: ct-punc
  use_itn: true
  batch_size_s: 60
  merge_vad: true

output:
  # simplified | traditional | auto
  script: simplified

text_processing:
  enable_filler_cleaning: true

memory:
  # 仅从用户点击“确认”的手动改动中学习；热路径只使用启动时加载的本地规则快照。
  enabled: true
  max_rules: 500

llm:
  provider: ollama                 # ollama | lmstudio | openai_compatible
  base_url: http://localhost:11434
  model: qwen3.5:9b
  temperature: 0.1
  top_p: 0.8
  num_ctx: 4096
  max_tokens: 600
  timeout_sec: 120

fast_llm:
  provider: ollama
  base_url: http://localhost:11434
  model: gemma4:e4b
  keep_alive: 30m
  temperature: 0.1
  top_p: 0.8
  num_ctx: 2048
  max_tokens: 220
  timeout_sec: 60

injector:
  restore_clipboard: true
  paste_delay_ms: 150
  auto_paste: true
  # GUI/热键默认不在控制台中断确认；高风险内容按 safety.block_auto_paste_on_high_risk 拦截。
  confirm_in_console: false

storage:
  db_path: data/sessions.db
  log_dir: data/logs

safety:
  enabled: true
  block_auto_paste_on_high_risk: false

glossary:
  path: src/glossary/tech_terms.json
