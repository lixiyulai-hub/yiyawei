name: architecture-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install chromium

      - name: Unit and contract tests
        run: python -X utf8 -m pytest -q

      - name: Web GUI end-to-end tests
        run: python -X utf8 -m pytest -c pytest.e2e.ini e2e -q

      - name: Compile Python sources
        run: python -X utf8 -m compileall app.py src tests scripts e2e

      - name: Package preflight
        run: python scripts/package_preflight.py --out "$env:RUNNER_TEMP/package_preflight.json" --fail-on-error

      - name: Check diff whitespace
        run: git diff --check
